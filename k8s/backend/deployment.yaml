apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: churn
  labels:
    app: backend
    project: churn-mlops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Prometheus will discover this pod and scrape /metrics
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      # Run as non-root (PodSecurity baseline / restricted)
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          # ⚠️  Image tag is bumped by GitHub Actions on each merge to main.
          # The literal "REPLACE_ME" is fine while bootstrapping; ArgoCD will
          # show the deployment as OutOfSync until CI does its first rewrite.
          image: REPLACE_ME_ECR_BACKEND_URI:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # ─── Resource requests & limits ────────────────────────────────
          # Tuned for tutorial. Re-tune in prod with VPA recommendations.
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          # ─── Env (non-secret) ──────────────────────────────────────────
          env:
            - name: LOG_ENV
              value: prod
            - name: LOG_LEVEL
              value: INFO
            - name: MLFLOW_TRACKING_URI
              value: databricks
            - name: MLFLOW_REGISTRY_URI
              value: databricks-uc
            - name: MODEL_NAME
              value: churn_mlops.models.churn_classifier
            - name: MODEL_ALIAS
              value: production
            - name: CORS_ORIGINS
              value: "*"

          # ─── Secrets (from k8s Secret `databricks-creds`) ──────────────
          envFrom:
            - secretRef:
                name: databricks-creds
                optional: false

          # ─── Probes ────────────────────────────────────────────────────
          # Liveness: am I alive? (process up, app responds)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds:       20
            failureThreshold:    3

          # Readiness: am I ready for traffic? (model is loaded)
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    6

          # Startup: give slow model downloads time before liveness kicks in
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds:       5
            failureThreshold:    60     # up to 5 min for cold starts

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          # Writable scratch for libraries that need /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Spread pods across nodes for resilience
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
