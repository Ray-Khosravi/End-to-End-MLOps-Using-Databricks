# ─────────────────────────────────────────────────────────────────────────
# ALB Ingress — provisions an internet-facing Application Load Balancer
# and routes:
#     /api/*  →  backend  Service  (FastAPI on port 8000)
#     /*      →  frontend Service  (NGINX on port 80)
#
# The AWS Load Balancer Controller (installed in Phase 9) watches Ingress
# resources with `ingressClassName: alb` and reconciles AWS ALB resources
# automatically.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churn-ingress
  namespace: churn
  annotations:
    # ── ALB basics ─────────────────────────────────────────────────────
    alb.ingress.kubernetes.io/scheme:           internet-facing
    alb.ingress.kubernetes.io/target-type:      ip
    alb.ingress.kubernetes.io/load-balancer-name: churn-mlops-alb

    # ── TLS (uncomment + set your ACM cert ARN) ────────────────────────
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/xxxxx
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06

    # ── For now, HTTP-only (replace with the HTTPS lines above in prod)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

    # ── Health-check & routing tweaks ──────────────────────────────────
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds:  "5"
    alb.ingress.kubernetes.io/success-codes:                "200"
    alb.ingress.kubernetes.io/group.name:                   churn-mlops

spec:
  ingressClassName: alb
  rules:
    # ── Once you have a domain, set it here. While testing, you can
    #    omit `host:` and the rule matches any host → the ALB DNS.
    - host: app.example.com           # ← change to your domain (or remove)
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
