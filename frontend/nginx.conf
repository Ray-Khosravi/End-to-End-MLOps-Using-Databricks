# ─────────────────────────────────────────────────────────────────────────
# NGINX config for the frontend container.
# Runs as non-root, listens on 8080 (avoids requiring CAP_NET_BIND_SERVICE).
# Serves static files from /usr/share/nginx/html and (optionally) proxies
# /api requests — though in our K8s setup, the ALB does that path-based
# routing externally, so the /api block here is mainly for local docker
# testing.
# ─────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;

    # NGINX in unprivileged container needs writable temp paths
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen       8080 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Static SPA ────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ── Local-dev proxy to backend ────────────────────────────────
        # In K8s with ALB Ingress, the ALB itself routes /api/* to the
        # backend Service, so this block is mainly for local docker runs.
        # The env-var $BACKEND_URL is injected via the Dockerfile entrypoint.
        location /api/ {
            # Strip the /api prefix and forward to the backend.
            rewrite ^/api/(.*) /$1 break;
            proxy_pass         ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Liveness endpoint for k8s probes
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
