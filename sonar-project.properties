# ─────────────────────────────────────────────────────────────────────────
# Sonar project config. Used by both SonarCloud and self-hosted SonarQube.
# ─────────────────────────────────────────────────────────────────────────

# Replace with your SonarCloud org/key (or your self-hosted Sonar project key)
sonar.projectKey=<your-org>_mlops-e2e
sonar.organization=<your-org>
sonar.projectName=Churn MLOps E2E
sonar.projectVersion=1.0

# What to scan
sonar.sources=backend/app,frontend
sonar.tests=backend/tests
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,**/.venv/**

# Python
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# Pull request decoration (set by the GH Action)
sonar.scm.provider=git

# Quality gate: fail the build if not "Passed"
sonar.qualitygate.wait=true
